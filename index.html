<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBL 2026-2027 경기 일정</title>
<link rel="stylesheet" href="./src/shared/styles/app.css">
</head>
<body>
<header>
  <h1>KBL 2026-2027 경기 일정</h1>
  <select id="teamSelect"></select>
  <button id="viewToggle">리스트 보기</button>
  <div class="nav" id="calNav">
    <button id="prevMonth">◀</button>
    <span id="monthLabel"></span>
    <button id="nextMonth">▶</button>
  </div>
</header>
<main>
  <div id="status">일정을 불러오는 중...</div>
  <table id="calendar" hidden>
    <thead><tr>
      <th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th>
    </tr></thead>
    <tbody id="calBody"></tbody>
  </table>
  <ul id="list" hidden></ul>
</main>
<script type="module" src="./src/app/main.js"></script>
</body>
</html>
